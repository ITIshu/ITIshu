<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" role="img" aria-labelledby="title desc"><title id="title">Ishant — bubbling pixel hologram</title><desc id="desc">A pixel portrait in a glowing cyan X-ray orbit with floating glass bubbles and a moving scan beam.</desc><defs><radialGradient id="bg"><stop stop-color="#172554"/><stop offset="1" stop-color="#020617"/></radialGradient><linearGradient id="neon"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#d946ef"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#ecfeff" stop-opacity=".85"/><stop offset=".4" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#c4b5fd" stop-opacity=".5"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="clip"><circle cx="250" cy="244" r="142"/></clipPath><style>.orbit1{transform-origin:250px 244px;animation:spin 8s linear infinite}.orbit2{transform-origin:250px 244px;animation:spin 12s linear infinite reverse}.pulse{animation:pulse 2.2s ease-in-out infinite}.scan{animation:scan 2.8s linear infinite}.bubble{transform-box:fill-box;transform-origin:center;animation:bob 3s ease-in-out infinite}.b2{animation-delay:-.7s}.b3{animation-delay:-1.5s}.b4{animation-delay:-2.2s}.b5{animation-delay:-.4s}.b6{animation-delay:-1.8s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.4}}@keyframes scan{from{transform:translateY(-130px);opacity:0}20%{opacity:.85}to{transform:translateY(130px);opacity:0}}@keyframes bob{50%{transform:translateY(-8px) scale(1.12);opacity:.65}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="500" height="500" rx="250" fill="url(#bg)"/><g class="pulse" filter="url(#glow)" fill="none" stroke="url(#neon)"><circle cx="250" cy="244" r="151" stroke-width="4"/><circle cx="250" cy="244" r="160" stroke-width="1.5" opacity=".65"/></g><image href="https://raw.githubusercontent.com/ITIshu/ITIshu/main/assets/ishant-pixel-hologram-avatar.png" x="108" y="102" width="284" height="284" clip-path="url(#clip)" preserveAspectRatio="xMidYMid slice"/><circle cx="250" cy="244" r="142" fill="none" stroke="#67e8f9" stroke-width="3" filter="url(#glow)"/><g class="scan" clip-path="url(#clip)" opacity=".8"><path d="M108 244H392" stroke="#e0faff" stroke-width="4"/><path d="M108 250H392" stroke="#22d3ee" stroke-width="9" opacity=".35"/></g><g class="orbit1" filter="url(#glow)"><circle cx="250" cy="69" r="8" fill="#22d3ee"/><circle cx="250" cy="69" r="3" fill="#fff"/></g><g class="orbit2" filter="url(#glow)"><circle cx="250" cy="49" r="5" fill="#d946ef"/></g><g class="bubble" filter="url(#glow)"><circle cx="82" cy="164" r="12" fill="url(#glass)" stroke="#a5f3fc"/><ellipse cx="78" cy="160" rx="3" ry="2" fill="#fff" opacity=".9"/></g><g class="bubble b2"><circle cx="410" cy="170" r="8" fill="url(#glass)" stroke="#67e8f9"/><ellipse cx="407" cy="167" rx="2.5" ry="1.5" fill="#fff"/></g><g class="bubble b3"><circle cx="99" cy="333" r="7" fill="url(#glass)" stroke="#a5f3fc"/></g><g class="bubble b4"><circle cx="401" cy="324" r="14" fill="url(#glass)" stroke="#c4b5fd"/><ellipse cx="396" cy="319" rx="3" ry="2" fill="#fff"/></g><g class="bubble b5"><circle cx="152" cy="75" r="5" fill="url(#glass)" stroke="#67e8f9"/></g><g class="bubble b6"><circle cx="351" cy="394" r="6" fill="url(#glass)" stroke="#67e8f9"/></g><g fill="none" stroke="#67e8f9" opacity=".45"><ellipse cx="250" cy="244" rx="205" ry="72" stroke-width="2" transform="rotate(-20 250 244)"/><ellipse cx="250" cy="244" rx="72" ry="205" stroke-width="1.5" transform="rotate(25 250 244)"/></g><text x="250" y="456" text-anchor="middle" fill="#a5f3fc" font-family="monospace" font-size="15" letter-spacing="3">ISHANT // XR-DEV</text></svg>
